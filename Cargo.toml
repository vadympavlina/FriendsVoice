[package]
name = "friends-voice"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15.3"
opus = "0.4"
rand = "0.8"

[[bin]]
name = "friends-voice"
path = "src/main.rs"

[[bin]]
name = "friends-voice-server"
path = "src/bin/server.rs"
