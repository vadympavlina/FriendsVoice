[package]
name = "friends-voice"
version = "0.9.0"
edition = "2021"
autobins = false

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15.3"
opus = "0.4"
rand = "0.8"
get_if_addrs = "0.5.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[[bin]]
name = "friends-voice"
path = "src/main.rs"
