name: Friends Voice Windows builds

on:
  push:
    branches: [main, 'dev/**', 'fix/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build and smoke-test Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust unit and integration tests
        shell: pwsh
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Compile native Windows apps
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Smoke-test the TCP server
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Package portable release (client + server)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'target/x86_64-pc-windows-msvc/release'
          $output = 'dist/FriendsVoice-Windows-x64'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item "$source/friends-voice.exe" "$output/friends-voice.exe"
          Copy-Item "$source/friends-voice-server.exe" "$output/friends-voice-server.exe"
          Copy-Item 'scripts/start-server.cmd' "$output/start-server.cmd"
          Copy-Item 'TESTING-README.txt' "$output/README.txt"
          Compress-Archive -Path "$output/*" -DestinationPath 'dist/FriendsVoice-Windows-x64.zip' -Force

      - name: Upload ZIP to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: FriendsVoice-Windows-x64
          path: dist/FriendsVoice-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic test release after each successful push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Friends Voice - Test build ${{ github.run_number }}
          body: |
            Automated Windows test build from commit ${{ github.sha }}.
            Download FriendsVoice-Windows-x64.zip. Voice requires TCP 45888 and UDP 45889.
          prerelease: true
          make_latest: false
          files: dist/FriendsVoice-Windows-x64.zip

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FriendsVoice-Windows-x64.zip
          generate_release_notes: true
