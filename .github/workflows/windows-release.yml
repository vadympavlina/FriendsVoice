name: Friends Voice Windows builds

on:
  push:
    branches: [main, 'dev/**', 'design/**', 'fix/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build and test serverless Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests (mesh, Opus ordering/PLC, JPEG recovery, sample conversion)
        shell: pwsh
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Compile native Windows app
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package portable serverless application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'target/x86_64-pc-windows-msvc/release'
          $output = 'dist/FriendsVoice-Windows-x64'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item "$source/friends-voice.exe" "$output/friends-voice.exe"
          Copy-Item 'TESTING-README.txt' "$output/README.txt"
          Compress-Archive -Path "$output/*" -DestinationPath 'dist/FriendsVoice-Windows-x64.zip' -Force

      - name: Upload ZIP to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: FriendsVoice-Windows-x64
          path: dist/FriendsVoice-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic test release after each successful push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Friends Voice - build ${{ github.run_number }}
          body: |
            Friends Voice Windows build from ${{ github.sha }}.
            Download FriendsVoice-Windows-x64.zip (one EXE inside). Radmin VPN required.
            Every peer must allow inbound UDP 45888 (chat/discovery), 45889 (voice) and 45890 (webcam) inside the trusted VPN. Webcam requires the Windows privacy setting that lets desktop apps use the camera.
            New in this build: redesigned minimal interface, camera selection by name with a private preview, 16:9 camera crop, 640x360 quality. Camera is still beta; no end-to-end encryption or screen sharing.
            Everyone in a call should use the same build.
          prerelease: true
          make_latest: false
          files: dist/FriendsVoice-Windows-x64.zip

      - name: Publish the Aurora Studio 1.0 milestone preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release(v1.0.0)')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Friends Voice 1.0
          body: |
            Friends Voice 1.0 milestone.
            P2P voice, chat and webcam over a trusted private Radmin VPN.

            Camera is still experimental JPEG/UDP.
            No built-in end-to-end encryption, identity verification,
            echo cancellation or screen sharing. This is a preview milestone,
            not a security-audited communication product.
          prerelease: true
          make_latest: false
          files: dist/FriendsVoice-Windows-x64.zip

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FriendsVoice-Windows-x64.zip
          generate_release_notes: true
