name: Friends Voice Windows builds

on:
  push:
    branches: [main, 'dev/**', 'design/**', 'fix/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build and test serverless Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests (mesh, Opus ordering/PLC, JPEG recovery, sample conversion)
        shell: pwsh
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Compile native Windows app
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package portable serverless application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'target/x86_64-pc-windows-msvc/release'
          $output = 'dist/FriendsVoice-Windows-x64'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item "$source/friends-voice.exe" "$output/friends-voice.exe"
          Copy-Item 'TESTING-README.txt' "$output/README.txt"
          Compress-Archive -Path "$output/*" -DestinationPath 'dist/FriendsVoice-Windows-x64.zip' -Force

      - name: Upload ZIP to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: FriendsVoice-Windows-x64
          path: dist/FriendsVoice-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic test release after each successful push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Friends Voice - Test build ${{ github.run_number }}
          body: |
            Friends Voice 0.9 Aurora UI (complete native desktop visual redesign) P2P Windows build from ${{ github.sha }}.
            Download FriendsVoice-Windows-x64.zip (only one EXE). Radmin VPN required.
            Every peer must allow inbound UDP 45888 for chat/discovery, UDP 45889 for voice, UDP 45890 for webcam. Webcam requires Windows desktop-app camera permission.
            Friends Voice 0.9 retains the 0.8 media wire format. Use 0.8 or later for media communication. Webcam remains experimental; screen sharing is not yet available.
          prerelease: true
          make_latest: false
          files: dist/FriendsVoice-Windows-x64.zip

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FriendsVoice-Windows-x64.zip
          generate_release_notes: true
